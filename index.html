<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal library</p>
          <h1>Book Scanner</h1>
        </div>

        <div class="toolbar">
          <label class="theme-picker">
            <span>Theme</span>
            <select id="themeSelect">
              <option value="classic">Classic</option>
              <option value="dark">Dark</option>
              <option value="sunset">Sunset</option>
              <option value="forest">Forest</option>
              <option value="midnight">Midnight</option>
            </select>
          </label>

          <div class="toolbar-actions">
            <button class="btn btn-secondary" id="exportJsonBtn">Export JSON</button>
            <button class="btn btn-secondary" id="exportCsvBtn">Export CSV</button>
            <button class="btn btn-primary" id="exportPdfBtn">Export PDF</button>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <div class="panel-header">
            <h2>Add or scan a book</h2>
          </div>

          <div class="scan-box">
            <label class="upload-label" for="imageInput">Scan from image or camera</label>
            <input id="imageInput" type="file" accept="image/*" capture="environment" />
            <button class="btn btn-primary" id="scanBtn">Scan with OCR</button>
          </div>

          <div class="status" id="scanStatus">Ready to scan.</div>

          <textarea id="ocrOutput" placeholder="OCR text will appear here..."></textarea>

          <div class="form-grid">
            <div class="field">
              <label for="titleInput">Title</label>
              <input id="titleInput" type="text" placeholder="Atomic Habits" />
            </div>

            <div class="field">
              <label for="authorInput">Author</label>
              <input id="authorInput" type="text" placeholder="James Clear" />
            </div>

            <div class="field">
              <label for="isbnInput">ISBN</label>
              <input id="isbnInput" type="text" placeholder="0735211299" />
            </div>

            <div class="field">
              <label for="tagInput">Status</label>
              <select id="tagInput">
                <option value="want-to-read">Want to read</option>
                <option value="reading">Reading</option>
                <option value="read">Read</option>
                <option value="borrowed">Borrowed</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="notesInput">Notes</label>
            <textarea id="notesInput" rows="4" placeholder="Add short notes or a memory about this book..."></textarea>
          </div>

          <div class="image-preview-wrap">
            <img id="coverPreview" alt="Book cover preview" hidden />
            <div id="coverPlaceholder" class="cover-placeholder">No cover selected</div>
          </div>

          <div class="actions-row">
            <button class="btn btn-secondary" id="coverBtn">Choose cover</button>
            <button class="btn btn-primary" id="addBookBtn">Add book</button>
          </div>
        </section>

        <section class="panel library-panel">
          <div class="panel-header library-header">
            <h2>Your library</h2>
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="Search title, author, ISBN" />
            </div>
          </div>

          <div id="libraryList" class="library-list"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
